<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Email
        <input id="email" type="email" required />
      </label>
      <label>Password
        <input id="password" type="password" required />
      </label>
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="muted">No account? <a href="register.html">Register</a></p>
    <div id="msg" class="msg"></div>
  </main>

  <script src="app.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await apiCall('/auth/login', 'POST', { email, password });
        if (res.message) {
          msg.textContent = res.message;
          msg.className = 'msg success';
          // token is set in HTTP-only cookie by server; go to profile
          setTimeout(() => window.location = 'profile.html', 700);
        } else {
          msg.textContent = res.message || res.error || 'Login failed';
          msg.className = 'msg error';
        }
      } catch (err) {
        msg.textContent = err.message || 'Network error';
        msg.className = 'msg error';
      }
    });
  </script>
</body>
</html>
